services:
  app:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file: ".env"
    environment:
      # Vite proxies /api/google/* to the Pages Functions backend. Both run in
      # compose now, so target the `functions` service over the compose network
      # (was host.docker.internal:8788 when wrangler ran on the host).
      - FUNCTIONS_TARGET=http://functions:8788
    depends_on:
      - functions

  functions:
    # Google Calendar OAuth backend — the Cloudflare Pages Functions in
    # functions/api/google/* (token exchange + silent refresh). Reuses the app
    # image (Node + project deps incl. wrangler). The server secrets
    # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET come from .dev.vars, which wrangler
    # auto-loads from the mounted repo — no Doppler needed here.
    build: .
    ports:
      - "8788:8788"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - WRANGLER_SEND_METRICS=false
    # `wrangler pages dev` needs the configured asset output dir (./dist) to
    # exist; create an empty one — the SPA is served by Vite, only /api/google/*
    # is proxied here, so the asset dir's contents don't matter.
    command: sh -c "mkdir -p dist && npx wrangler pages dev --ip 0.0.0.0 --port 8788"
