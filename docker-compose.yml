services:
  app:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file: ".env"
    environment:
      # The container's own 127.0.0.1 isn't the host, so point the Vite
      # /api/google proxy at the host where `wrangler pages dev` runs.
      - FUNCTIONS_TARGET=http://host.docker.internal:8788
    extra_hosts:
      # Ensure host.docker.internal resolves to the host gateway.
      - "host.docker.internal:host-gateway"
